spring.application.name=CarRent
server.port=${PORT:8080}

# Database (MySQL). For a managed database put the whole URL (with TLS options) in DB_URL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carrental}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Login tokens. JWT_SECRET is required (at least 32 characters); there is no default on purpose.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION_MS:28800000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# First administrator, created only while no user exists
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@carrental.demo}
app.admin.password=${ADMIN_PASSWORD:}

# Demo agency (cars, clients, contracts, expenses, partners, staff accounts)
app.demo-data=${DEMO_DATA:false}
app.demo-password=${DEMO_PASSWORD:Rental@2026!}

# Browsers allowed to call the API, and the address of the web app (used in password reset e-mails)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.web-url=${WEB_URL:http://localhost:4200}

# E-mail (password reset). Optional: without SMTP the reset mail is simply not sent.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Name and currency printed on contract and invoice PDFs, and when the daily alert check runs (cron, server time)
app.agency.name=${AGENCY_NAME:Demo Car Rental}
app.agency.currency=${AGENCY_CURRENCY:TND}
app.alerts.cron=${ALERTS_CRON:0 0 6 * * *}
